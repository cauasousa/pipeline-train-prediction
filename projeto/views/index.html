<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Plataforma YOLO Classificação</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>

<body>
    <div class="sidebar" id="sidebar" aria-expanded="true">
        <div class="toggle-btn" onclick="toggleSidebar()">☰</div>

        <div class="menu-item active" data-page="treinamento" onclick="navigate('treinamento')">
            <i class="fas fa-brain"></i><span>Treinamento</span>
        </div>

        <div class="menu-item" data-page="predicao" onclick="navigate('predicao')">
            <i class="fas fa-search"></i><span>Predição</span>
        </div>

    </div>

    <main class="main-content" id="main-content">
        <div id="view" aria-live="polite">
        </div>
    </main>

    <div id="img-modal" class="img-modal hidden" role="dialog" aria-hidden="true" aria-modal="true">
        <div id="img-modal-backdrop" class="img-modal-backdrop" tabindex="-1"></div>
        <div class="img-modal-content" role="document" aria-live="polite">
            <button id="img-modal-close" class="img-modal-close" aria-label="Fechar imagem">✖</button>
            <!-- caption placed above the image -->
            <div id="img-modal-caption" class="img-modal-caption" aria-hidden="true"></div>

            <!-- viewport groups image and nav buttons so buttons align with the image center -->
            <div class="img-modal-viewport">
                <button id="img-modal-prev" class="img-modal-nav img-modal-prev" aria-label="Imagem anterior">◀</button>
                <img id="img-modal-img" src="" alt="" />
                <button id="img-modal-next" class="img-modal-nav img-modal-next" aria-label="Próxima imagem">▶</button>
            </div>
        </div>
    </div>

    <!-- Modal de Pré-processamento (renderizado no nível raiz para evitar conflitos de z-index) -->
    <div id="preprocess-modal" class="preprocess-modal">
        <div class="preprocess-modal-container">
            <!-- HEADER -->
            <div class="preprocess-modal-header">
                <strong>Pré-processamento de Imagem — Pipeline Interativo</strong>
                <div>
                    <button id="apply-preprocess-btn" class="btn-modal btn-modal-apply">Aplicar</button>
                    <button id="close-preprocess-modal-btn" class="btn-modal btn-modal-close">Fechar</button>
                </div>
            </div>

            <!-- BODY -->
            <div class="preprocess-modal-body">
                <!-- PIPELINE -->
                <div class="preprocess-modal-sidebar">
                    <span class="preprocess-modal-label">ORDEM DE APLICAÇÃO</span>
                    <ul id="preprocessing-pipeline-list" class="preprocessing-pipeline-list">
                        <!-- Técnicas serão adicionadas aqui dinamicamente -->
                    </ul>

                    <div class="preprocess-modal-controls">
                        <label class="preprocess-modal-label">TÉCNICAS DISPONÍVEIS</label>
                        <select id="available-techniques-select" class="preprocess-select">
                            <option value="">Carregando...</option>
                        </select>
                        <button id="add-technique-btn" class="btn-add-technique">+ Adicionar técnica</button>
                    </div>
                </div>

                <!-- VISUALIZAÇÃO -->
                <div class="preprocess-modal-content">
                    <!-- PIPELINE DE ETAPAS CUMULATIVAS -->
                    <div class="pipeline-steps-section">
                        <span class="preprocess-modal-label">EVOLUÇÃO DO PIPELINE — CADA ETAPA</span>
                        <div id="pipeline-steps-gallery" class="pipeline-steps-gallery">
                            <!-- Etapas serão renderizadas aqui dinamicamente -->
                        </div>
                    </div>

                    <!-- PREVIEWS PRINCIPAIS -->
                    <div class="preprocess-modal-grid">
                        <!-- ORIGINAL -->
                        <div class="preprocess-preview-card">
                            <span class="preview-label preview-label-original">ORIGINAL</span>
                            <img src="" class="preview-img original">
                        </div>

                        <!-- PIPELINE FINAL -->
                        <div class="preprocess-preview-card preview-card-result">
                            <span class="preview-label preview-label-result">RESULTADO FINAL</span>
                            <img src="" class="preview-img result">
                        </div>

                        <!-- TÉCNICA ISOLADA -->
                        <div class="preprocess-preview-card">
                            <span class="preview-label preview-label-isolated">TÉCNICA ISOLADA</span>
                            <div style="margin: 6px 0;">
                                <select id="isolated-technique-select" class="preprocess-select"
                                    style="max-width: 100%;">
                                    <option value="">Selecione a técnica isolada...</option>
                                </select>
                            </div>
                            <img src="" class="preview-img isolated">
                        </div>
                    </div>
                </div>
            </div>

            <!-- SNACKBAR -->
            <div class="preprocess-modal-footer">
                ● Pipeline atualizado — aguardando processamento
            </div>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/finder.js"></script>
    <script src="./js/modules/config.js"></script>
    <script src="./js/modules/modal.js"></script>
    <script src="./js/modules/navigation.js"></script>
    <script src="./js/training_control.js"></script>
    <script src="./js/prediction_history.js"></script>
    <script src="./js/preprocessing_modal.js"></script>
    <script src="./js/preprocessing_modal_prediction.js"></script>
    <script src="./js/ui.js"></script>

    <script>
        // init UI after modules loaded
        window.addEventListener('DOMContentLoaded', () => {
            if (window.UI && typeof window.UI.init === 'function') window.UI.init();
        });
    </script>
</body>

</html>
