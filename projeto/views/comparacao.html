<div class="section" id="comparison-page">
    <div class="section-header" style="margin-top: 30px;">
        <span class="section-step">HISTÓRICO</span>
        <h3>Histórico e Comparação</h3>
    </div>

    <div class="card" style="margin-bottom: 25px; padding: 20px;">
        <div style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 280px;">
                <label for="job-select"
                    style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">
                    Selecione uma execução anterior:
                </label>
                <select id="job-select" class="input" style="width: 100%; height: 42px;"></select>
            </div>
            <button class="btn btn-primary" id="job-select-apply"
                style="height: 42px; padding: 0 25px; font-weight: 600;">
                ▶️ Carregar Resultados
            </button>
            <button class="btn" onclick="location.reload()" title="Atualizar lista"
                style="height: 42px; padding: 0 15px;">
                🔄
            </button>
        </div>
    </div>

    <div id="training-images" class="card" style="min-height: 500px; padding: 20px;">

        <div id="training-images-placeholder"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; color: var(--text-muted);">
            <div style="font-size: 4rem; margin-bottom: 15px; opacity: 0.3;">🖼️</div>
            <p style="font-size: 1rem; text-align: center; max-width: 350px; line-height: 1.5;">
                Selecione uma predição no menu acima para visualizar e comparar os resultados dos modelos.
            </p>
        </div>
    </div>

</div>
